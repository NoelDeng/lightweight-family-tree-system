<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清空数据库</title>
</head>
<body>
    <h1>清空族谱数据库</h1>
    <button onclick="clearDatabase()">清空数据库</button>
    <div id="result"></div>

    <script>
        const dbName = 'FamilyTreeDB';
        const version = 1;

        async function clearDatabase() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在清空数据库...';

            try {
                // 打开数据库
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open(dbName, version);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('familyNodes')) {
                            db.createObjectStore('familyNodes', { keyPath: 'id' });
                        }
                    };
                });

                // 清空数据
                const transaction = db.transaction(['familyNodes'], 'readwrite');
                const store = transaction.objectStore('familyNodes');
                await new Promise((resolve, reject) => {
                    const request = store.clear();
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });

                resultDiv.innerHTML = '<p style="color: green;">✓ 数据库已清空！</p>';
                console.log('数据库已清空');

                // 关闭数据库
                db.close();
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ 清空失败：${error.message}</p>`;
                console.error('清空数据库失败：', error);
            }
        }
    </script>
</body>
</html>
