<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清空管理员密码</title>
</head>
<body>
    <h1>清空管理员密码</h1>
    <button onclick="clearPassword()">清空管理员密码</button>
    <div id="result"></div>

    <script>
        const dbName = 'FamilyTreeDB';
        const version = 1;

        async function clearPassword() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在清空管理员密码...';

            try {
                // 打开数据库
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open(dbName, version);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('users')) {
                            db.createObjectStore('users', { keyPath: 'id' });
                        }
                    };
                });

                // 删除管理员用户
                const transaction = db.transaction(['users'], 'readwrite');
                const store = transaction.objectStore('users');
                await new Promise((resolve, reject) => {
                    const request = store.delete('admin');
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });

                resultDiv.innerHTML = '<p style="color: green;">✓ 管理员密码已清空！</p>';
                console.log('管理员密码已清空');

                // 关闭数据库
                db.close();
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">✗ 清空失败：${error.message}</p>`;
                console.error('清空管理员密码失败：', error);
            }
        }
    </script>
</body>
</html>
